<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StockSense — Workspace Router</title>
    <style>
        body {
            background-color: #0b1720;
            color: #ffffff;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            display: grid;
            place-items: center;
            height: 100vh;
            margin: 0;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(8, 127, 118, 0.2);
            border-top-color: #087f76;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        p {
            color: #8fa0ab;
            font-size: 14px;
        }
    </style>
    <script>
        (function () {
            const rawUser = localStorage.getItem('stocksense_current_user');
            if (!rawUser) {
                window.location.href = 'login page.html';
                return;
            }
            try {
                const user = JSON.parse(rawUser);
                const role = (user && user.role) ? user.role.toLowerCase() : 'worker';
                if (role === 'admin') {
                    window.location.href = 'admin_home.html';
                } else if (role === 'manager') {
                    window.location.href = 'manager_home.html';
                } else {
                    window.location.href = 'worker_home.html';
                }
            } catch (e) {
                window.location.href = 'login page.html';
            }
        })();
    </script>
</head>

<body>
    <div class="card">
        <div class="spinner"></div>
        <h3>Routing to your StockSense Workspace...</h3>
        <p>Directing you to your role-specific home terminal.</p>
    </div>
</body>

</html>
